version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      paramore:
        patterns: ["Paramore.*"]
      test:
        patterns: ["xunit*", "Microsoft.Extensions.TimeProvider.Testing"]
